%YAML:1.0
# OpenVINS ov_msckf tuning (stereo-inertial). Camera intrinsics/extrinsics come
# from the Gazebo SDF (sim) or the EuRoC Kalibr file (real data).
verbosity: "INFO"
use_stereo: true
max_cameras: 2
calib_camimu_dt: 0.0            # exact in sim; dataset value on EuRoC
cam0_wh: [640, 480]
cam1_wh: [640, 480]
cam0_intrinsics: [460.0, 460.0, 320.0, 240.0]
cam1_intrinsics: [460.0, 460.0, 320.0, 240.0]
# IMU noise matched to Honeywell HG4930 CA51 (see docs/AETHER_BIBLE.pdf)
gyroscope_noise_density: 1.6968e-04
gyroscope_random_walk: 1.9393e-05
accelerometer_noise_density: 2.0000e-03
accelerometer_random_walk: 3.0000e-03
max_clones: 5                  # MSCKF sliding-window depth
max_slam: 50
dt_slam_delay: 1.0
